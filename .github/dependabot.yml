# Weekly dependency update PRs (never auto-merged; CI runs on each).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /          # root requirements.txt
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /platform  # platform/package.json (Cloudflare Worker, dev tooling)
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /trust     # trust/package.json (trust engine CLI)
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
