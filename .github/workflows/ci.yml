name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust:
    # Commonworld trust engine (trust/, TRUST.md): unit tests with mocked sources + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
  atlas:
    # Bot-opened refresh PRs get CI via workflow_dispatch from refresh.yml instead (pull_request from GITHUB_TOKEN fails without secrets).
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Migration scan (report only; the production deploy blocks pending destructive ones)
        if: hashFiles('platform/wrangler.toml') != ''
        run: |
          if [ -d platform/migrations ]; then python scripts/check-migrations.py --dir platform/migrations --all --warn-only
          else echo "no platform/migrations"; fi
      - name: Install
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Install CI-only tools (standard JSON Schema validator)
        run: |
          python -m pip install --only-binary=:all: -r requirements-ci.txt
      - name: Fetch the migration baseline anchor commit
        # tests/test_check_migrations.py compares the historical migrations 0008, 0009, 0018 with their content at the
        # commit that added them (BASELINE_ANCHOR_COMMIT there); the checkout is shallow, so fetch just that commit
        run: git fetch --depth=1 --no-tags origin 6803510fad7d186c59d7e922259876f1892edca0
      - name: Unit tests (refresh security, link safety, migration gate, screens lock, screenshot capture, screens artifact)
        # after Install: the screenshot-capture image tests need Pillow (requirements.txt, pinned Pillow==13.0.0);
        # CW_REQUIRE_PIL=1 makes them fail instead of skip if it is ever missing; CW_WEBP_DECODE_REQUIRED=1 does the
        # same for the WebP decode check of the screens artifact (tests/test_screens_artifact.py);
        # CW_REQUIRE_MIGRATION_ANCHOR=1 does the same for the migration baseline anchor commit;
        # CW_NET_TESTS=1 runs the Agent Errata known-answer test (tests/test_replications_pinned.py), which reads one
        # pinned upstream commit from GitHub without a token (one unauthenticated api.github.com call; no token is exposed
        # to PR-controlled code, AGENTS.md)
        env:
          CW_REQUIRE_PIL: '1'
          CW_WEBP_DECODE_REQUIRED: '1'
          CW_REQUIRE_MIGRATION_ANCHOR: '1'
          CW_NET_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Fetch homepage screenshots (atlas-screens commit pinned in atlas/screens.lock)
        # images live only on the orphan branch atlas-screens; the build uses exactly the commit in the lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          screens_sha=$(tr -d ' \t\r' < atlas/screens.lock)
          [ "$(wc -l < atlas/screens.lock)" -le 1 ] || { echo "::error::atlas/screens.lock must be one line"; exit 1; }
          case "$screens_sha" in *[!0-9a-f]*|'') echo "::error::atlas/screens.lock is not lowercase hex"; exit 1 ;; esac
          [ "${#screens_sha}" -eq 40 ] || { echo "::error::atlas/screens.lock must hold a full 40-character sha"; exit 1; }
          git fetch --depth=1 --no-tags origin "$screens_sha" || { echo "::error::atlas-screens commit $screens_sha not found"; exit 1; }
          git cat-file -e "$screens_sha^{commit}"
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$screens_sha...atlas-screens" -q .status)
          case "$status" in identical) echo "screens lock = atlas-screens head" ;;
            ahead) echo "::notice::atlas-screens has newer commits than atlas/screens.lock; bump the lock in a PR to publish them" ;;
            *) echo "::error::$screens_sha is not on atlas-screens ($status)"; exit 1 ;; esac
      - name: Pinned screenshots pass the publish-side WebP check
        # the same checks screens.yml's publish job runs (atlas/tools/screens_artifact.py) on every stored image:
        # bounded read, stdlib structure, a real Pillow decode to the manifest size (required: no Pillow = failure),
        # sha256 and size against the manifest
        env:
          CW_WEBP_DECODE_REQUIRED: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinned"
          git archive "$(tr -d ' \t\r' < atlas/screens.lock)" atlas/screens | tar -x -C "$RUNNER_TEMP/pinned"
          CW_ATLAS_SCREENS="$RUNNER_TEMP/pinned/atlas/screens" \
            python -m unittest -v tests.test_screens_artifact.Artifact.test_real_atlas_screens 2>&1 | tee "$RUNNER_TEMP/pinned.log"
          grep -q '^OK$' "$RUNNER_TEMP/pinned.log" && ! grep -q 'skipped' "$RUNNER_TEMP/pinned.log"
      - name: Build
        env:
          CW_SCREENS_REQUIRED: '1'   # CI must publish the previews; a local build without the branch shows placeholders
        run: python atlas/site/build.py
      - name: GitHub data mirror is up to date
        run: |
          if [ -n "$(git status --porcelain -- atlas/public)" ]; then
            git status --porcelain -- atlas/public | head -20
            echo "::error::atlas/public is stale: run python3 atlas/site/build.py and commit atlas/public"; exit 1
          fi
      - name: Check
        env:
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
          CW_SCREENS_REQUIRED: '1'
          # Actions secrets are not given to pull requests from forks, nor to runs triggered by Dependabot (its weekly
          # update PRs, .github/dependabot.yml): only there may the forbidden-text check be skipped. github.actor is the
          # account that triggered this run, so a person pushing to a Dependabot branch gets the secret and the check.
          SECRETLESS_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          if [ -z "$CW_PRIVATE_TERMS" ]; then
            if [ "$SECRETLESS_PR" = true ]; then echo "::warning::fork or Dependabot pull request: secret CW_PRIVATE_TERMS unavailable, forbidden-text check skipped"
            else echo "::error::secret CW_PRIVATE_TERMS not set: the forbidden-text check cannot be skipped here"; exit 1; fi
          fi
          python atlas/site/check.py
      - name: API v1 files match their JSON Schemas (jsonschema, Draft 2020-12 + formats)
        run: python atlas/site/tools/validate_jsonschema.py atlas/site/dist/api/v1
      - name: Smoke (browser)
        env:
          SHOTS_DIR: atlas/site/screenshots/smoke
        run: |
          mkdir -p "$SHOTS_DIR"
          python atlas/site/tools/smoke_test.py
      - name: Smoke screenshots (artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots
          path: atlas/site/screenshots/smoke/
          retention-days: 14
          if-no-files-found: ignore
