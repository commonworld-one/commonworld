name: Atlas weekly refresh
# Re-checks every Atlas entry (atlas/refresh.py), copies the Citizens numbers of /stats/ from the platform's Pulse (atlas/tools/stats_from_pulse.py),
# rebuilds and validates the site, and opens a PR when data changed.
# Never auto-merges. PRs opened with GITHUB_TOKEN do not trigger ci.yml normally, so this job runs build + check + smoke itself and then dispatches ci.yml on the PR branch (workflow_dispatch is allowed from GITHUB_TOKEN), which shows as the PR's check.
on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write           # dispatch ci.yml on the refresh branch so the PR gets a CI check
  issues: write            # create the atlas-refresh label
concurrency:
  group: atlas-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Carry state from an open refresh PR
        id: prev
        run: |
          gh label create atlas-refresh --color 63705b --description "Automated weekly Atlas refresh" --force || true
          # Only trust refresh PRs this workflow itself opened: same repo, bot author, refresh/<date> branch.
          # Output PR numbers only; branch names never reach a script template.
          trusted='[.[] | select(.isCrossRepository == false and (.author.login == "app/github-actions" or .author.login == "github-actions") and (.headRefName | test("^refresh/[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]{4})?$")))]'
          list=$(gh pr list --state open --label atlas-refresh --json number,headRefName,isCrossRepository,author --jq "$trusted")
          prs=$(jq -r '[.[].number | tostring] | join(",")' <<< "$list")
          if ! [[ "$prs" =~ ^[0-9,]*$ ]]; then echo "::error::unexpected PR list"; exit 1; fi
          echo "open=$prs" >> "$GITHUB_OUTPUT"
          newest=$(jq -r 'sort_by(.number) | last | .headRefName // empty' <<< "$list")
          if [ -n "$newest" ]; then
            git fetch origin "$newest"
            git show "origin/$newest:atlas/data/refresh-state.json" > "$RUNNER_TEMP/prev-state.json" || true
            echo "Carrying state from open PR branch $newest"
          fi
      - name: Refresh
        run: |
          python atlas/refresh.py --state-from "$RUNNER_TEMP/prev-state.json" \
            --summary "$RUNNER_TEMP/summary.md" --report "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Stats from Pulse
        # Citizens rows of atlas/data/stats.json from https://commonworld.one/v1/pulse. Fail-safe: when Pulse is unreachable or
        # its shape is unexpected the script leaves the file unchanged, prints a ::warning:: and exits 0.
        run: python atlas/tools/stats_from_pulse.py --summary "$RUNNER_TEMP/summary.md"
      - name: Changed?
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- atlas/data)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          git status --porcelain -- atlas/data
      - name: Build
        run: python atlas/site/build.py
      - name: Check
        env:
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
        run: |
          if [ -z "$CW_PRIVATE_TERMS" ]; then echo "::error::secret CW_PRIVATE_TERMS not set"; exit 1; fi
          python atlas/site/check.py
      - name: Smoke (browser)
        run: python atlas/site/tools/smoke_test.py
      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="refresh/$(date -u +%F)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then branch="$branch-$(date -u +%H%M)"; fi
          git switch -c "$branch"
          git add atlas/data atlas/public
          git commit -m "Atlas weekly refresh $(date -u +%F)" -m "Automated by .github/workflows/refresh.yml (atlas/refresh.py). Review before merging."
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Atlas weekly refresh $(date -u +%F)" \
                --body-file "$RUNNER_TEMP/summary.md" --label atlas-refresh)
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "NEW_PR=$url" >> "$GITHUB_ENV"
          gh workflow run ci.yml --ref "$branch" && echo "Dispatched CI on $branch" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Close superseded refresh PRs
        if: steps.prev.outputs.open != ''
        env:
          OPEN_PRS: ${{ steps.prev.outputs.open }}
        run: |
          IFS=',' read -ra prs <<< "$OPEN_PRS"
          for n in "${prs[@]}"; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "::warning::skipping non-numeric PR id"; continue; }
            if [ -n "${NEW_PR:-}" ]; then msg="Superseded by $NEW_PR (newer weekly refresh; its state carries this PR's suspected/failed counts)."
            else msg="Closed: the newest weekly refresh found no difference from main, so this PR is obsolete."; fi
            gh pr close "$n" --comment "$msg" --delete-branch || true
          done
