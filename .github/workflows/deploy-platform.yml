name: Deploy platform (production)
# Production deploy of the Commonworld platform (Cloudflare Worker + D1, folder platform/). See docs/DEPLOY.md.
#
# The gate job still skips the deploy job when a commit has no platform/wrangler.toml (no approval request, no secrets
# handed out, nothing touched); every commit on main since 2026-10-20 has one.
#
# Only started by hand (Actions -> Deploy platform (production) -> Run workflow, branch main) with the full commit
# sha to release. That commit must already be on main. The deploy job uses the GitHub environment `production`:
# it waits for a required reviewer's approval, and only then receives CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# (environment secrets). Never runs on pull_request, push or schedule.
#
# Jobs (same split as the staging deploy): gate (github.token only) -> build (the released commit's code: npm install, tests, Atlas
# build, Worker bundle; NO environment, NO secrets) -> private-scan (CW_PRIVATE_TERMS, trusted code of main only, the build as
# data) -> deploy (the ONLY job with the environment approval and the Cloudflare token; trusted code of main only: Wrangler
# pinned in .github/deploy-tools, check-migrations.py of main; the release arrives as a verified artifact read as data) ->
# verify (smoke tests, no secrets). Rollback pointers unchanged: production version and Time Travel bookmark in the summary.
#
# What gets released is fixed by the sha alone: platform code and Atlas data come from that commit, the homepage
# screenshots from the atlas-screens commit named in atlas/screens.lock at that commit. A release manifest (all three
# shas, sha256 of the built Atlas assets, wrangler version) is printed in the job summary and kept as an artifact.
# Pending D1 migrations with destructive, row-writing, review-required or unreadable SQL stop the run (scripts/check-migrations.py,
# expand -> deploy -> contract); allow_destructive_migration = the same sha typed again lets one such release through
# (a migration that changes existing rows also needs a `-- reviewed-by-owner: #<PR>` header line, docs/DEPLOY.md).
# The production version live before the deploy is printed in the summary with the exact rollback command.
#
# Staging first (#145): the gate job refuses the sha unless a green "Deploy platform (staging)" run (deploy + smoke +
# e2e) shipped exactly this commit. The staging deploy job uploads the artifact staging-deployed-<sha>; the gate finds
# it through the GitHub API (actions: read, gate job only) and checks that its run is a successful workflow_dispatch run
# of deploy-staging.yml on main, that its jobs "Deploy to staging" and "E2E against staging (read-only)" both succeeded
# in the latest attempt, that no attempt of that run deployed another commit, and that the run finished at most 7 days
# ago (older: deploy the sha to staging again). Emergency only:
# emergency_skip_staging_check = true with a written emergency_reason; the reason goes into the run summary and the
# release manifest.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (full 40-character sha)
        required: true
        type: string
      allow_destructive_migration:
        description: Leave empty. Only to let a destructive migration through, type the same sha again
        required: false
        default: ''
        type: string
      emergency_skip_staging_check:
        description: Emergency only. Deploy without a green staging run (deploy + e2e) of this sha. Needs emergency_reason
        required: false
        default: false
        type: boolean
      emergency_reason:
        description: Required with emergency_skip_staging_check. Why this release cannot wait for staging (shown in the summary)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  # one production deploy at a time; a second one waits, a running one is never cancelled
  group: deploy-platform-production
  cancel-in-progress: false
jobs:
  gate:
    name: Check the commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # read deploy-staging runs, their jobs and artifacts (staging check); nothing else
    outputs:
      has_platform: ${{ steps.platform.outputs.has_platform }}
      staging_check: ${{ steps.staging.outputs.staging_check }}
      staging_run: ${{ steps.staging.outputs.staging_run }}
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - name: Sha is a full commit id
        run: |
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::sha must be lowercase hex, got '$SHA'"; exit 1 ;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be the full 40-character commit, got '$SHA'"; exit 1; }
      - name: Sha is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # compare/<sha>...main: "identical" or "ahead" means main contains the commit
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" -q .status)
          case "$status" in identical|ahead) echo "$SHA is on main ($status)" ;;
            *) echo "::error::$SHA is not on main (compare status: $status)"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: platform/ exists in that commit
        id: platform
        run: |
          if [ -f platform/wrangler.toml ]; then echo "has_platform=true" >> "$GITHUB_OUTPUT"
          else echo "has_platform=false" >> "$GITHUB_OUTPUT"; echo "::notice::no platform/wrangler.toml at $SHA, nothing to deploy"; fi
      - name: Same commit passed staging (deploy + smoke + e2e)
        # Release order (docs/DEPLOY.md): merge into main -> deploy that main commit to staging -> production.
        id: staging
        if: steps.platform.outputs.has_platform == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.emergency_skip_staging_check }}
          REASON_INPUT: ${{ inputs.emergency_reason }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          wf=.github/workflows/deploy-staging.yml
          art="staging-deployed-$SHA"
          MAX_AGE_DAYS=7  # a green staging run counts only if it finished at most 7 days ago (docs/DEPLOY.md)
          reason=$(printf '%s' "$REASON_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          case "$reason" in *[[:cntrl:]]*) echo "::error::emergency_reason must be one line of plain text"; exit 1 ;; esac
          if [ "$OVERRIDE" = true ] && [ -z "$reason" ]; then
            echo "::error::emergency_skip_staging_check needs emergency_reason: write why this release cannot wait for staging"; exit 1
          fi
          if [ "$OVERRIDE" != true ] && [ -n "$reason" ]; then
            echo "::warning::emergency_reason is ignored: emergency_skip_staging_check is off, the staging check runs"
          fi
          found=''; why=''
          # A green deploy-staging run that shipped exactly $SHA: the staging deploy job uploads staging-deployed-<sha>.
          # Checks run inside the function; it never exits the step on an API error, it returns 1 with the reason.
          lookup() {
            local runs id run jobs names
            runs=$(gh api "repos/$repo/actions/artifacts?name=$art&per_page=100" \
              | jq -r --arg a "$art" '[.artifacts[] | select(.name == $a) | .workflow_run.id] | unique | sort | reverse | .[]') \
              || { why="GitHub API: could not list artifacts named $art"; return 1; }
            [ -n "$runs" ] || { why="no staging run has uploaded $art"; return 1; }
            for id in $runs; do
              run=$(gh api "repos/$repo/actions/runs/$id") || { why="$why; run $id: GitHub API error"; continue; }
              if ! jq -e --arg wf "$wf" --arg repo "$repo" '
                  (.path | sub("@.*$"; "")) == $wf and .event == "workflow_dispatch" and .head_branch == "main"
                  and .repository.full_name == $repo and .status == "completed" and .conclusion == "success"' \
                  <<<"$run" >/dev/null; then
                why="$why; run $id: not a successful Deploy platform (staging) run started from main"; continue
              fi
              jobs=$(gh api "repos/$repo/actions/runs/$id/jobs?filter=latest&per_page=100") \
                || { why="$why; run $id: GitHub API error (jobs)"; continue; }
              if ! jq -e '
                  ([.jobs[] | select(.name == "Deploy to staging" and .conclusion == "success")] | length) == 1
                  and ([.jobs[] | select(.name == "E2E against staging (read-only)" and .conclusion == "success")] | length) == 1' \
                  <<<"$jobs" >/dev/null; then
                why="$why; run $id: deploy or e2e job not successful in the latest attempt"; continue
              fi
              # every attempt uploads staging-deployed-<the sha it deployed> (overwrite on the same sha), so a re-run
              # that deployed another commit (the ref was a branch that moved) leaves two names: not proof for either
              names=$(gh api "repos/$repo/actions/runs/$id/artifacts?per_page=100" \
                | jq -r '[.artifacts[].name | select(startswith("staging-deployed-"))] | unique | join(" ")') \
                || { why="$why; run $id: GitHub API error (artifacts)"; continue; }
              if [ "$names" != "$art" ]; then why="$why; run $id: its attempts deployed more than one commit ($names)"; continue; fi
              # freshness: the run must have finished at most MAX_AGE_DAYS ago (updated_at = completion of its last attempt)
              done_at=$(jq -r '.updated_at // empty' <<<"$run")
              done_s=$(jq -rn --arg t "$done_at" '$t | fromdateiso8601' 2>/dev/null) \
                || { why="$why; run $id: no readable completion time ('$done_at')"; continue; }
              age=$(( $(date -u +%s) - done_s ))
              if [ "$age" -gt $(( MAX_AGE_DAYS * 86400 )) ]; then
                why="$why; run $id: green but too old, finished $done_at, $(( age / 86400 )) d $(( age % 86400 / 3600 )) h ago (limit $MAX_AGE_DAYS days): deploy this sha to staging again"
                continue
              fi
              found=$(jq -r .html_url <<<"$run")
              return 0
            done
            return 1
          }
          lookup || true
          echo "staging_run=$found" >> "$GITHUB_OUTPUT"
          if [ "$OVERRIDE" = true ]; then
            echo "staging_check=overridden" >> "$GITHUB_OUTPUT"
            echo "::warning title=EMERGENCY: staging check skipped::$reason"
            {
              echo "## EMERGENCY OVERRIDE: staging check skipped"
              echo
              echo "This release of \`$SHA\` did **not** require a green staging deploy + e2e of the same commit."
              echo
              echo "**Reason given:**"
              echo
              echo "> $reason"
              echo
              echo "Started by: @$GITHUB_ACTOR"
              if [ -n "$found" ]; then echo; echo "A green staging run of this sha exists anyway: $found"
              else echo; echo "No green staging run of this sha was found (${why#; })."; fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$found" ]; then
            echo "staging_check=passed" >> "$GITHUB_OUTPUT"
            echo "staging passed for $SHA: $found"
            # shellcheck disable=SC2016  # the backticks are Markdown, not a command
            printf '## Staging check: passed\n\nGreen staging deploy + e2e of `%s`: %s\n' "$SHA" "$found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::no green staging run for $SHA (${why#; }). Release order: merge into main, run Deploy platform (staging) with ref = this sha and wait for deploy + e2e to pass, then deploy production (docs/DEPLOY.md). Emergency only: emergency_skip_staging_check with emergency_reason."
          exit 1
  build:
    name: Build the release (no secrets)
    needs: gate
    if: needs.gate.outputs.has_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No environment and no secrets: this job runs the released commit's code (npm install, tests, the Atlas build).
    outputs:
      tar_sha256: ${{ steps.pack.outputs.tar_sha256 }}
      indexnow_key: ${{ steps.key.outputs.indexnow_key }}
    env:
      SHA: ${{ inputs.sha }}
      STAGING_CHECK: ${{ needs.gate.outputs.staging_check }}
      STAGING_RUN: ${{ needs.gate.outputs.staging_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Checked-out commit is the requested one
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$SHA" ] || { echo "::error::checked out $head, expected $SHA"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          # no pip cache: the job that holds the Cloudflare credentials uploads what this one built
      - name: Install the pinned Wrangler (lockfile of main, no lifecycle scripts)
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only the two lockfile files of the workflow commit (main) are read as data from git; nothing of main runs here.
          git fetch --quiet --no-tags --depth=1 origin "$TRUSTED_SHA"
          mkdir -p "$RUNNER_TEMP/wrangler-tool"
          git show "$TRUSTED_SHA:.github/deploy-tools/package.json" > "$RUNNER_TEMP/wrangler-tool/package.json"
          git show "$TRUSTED_SHA:.github/deploy-tools/package-lock.json" > "$RUNNER_TEMP/wrangler-tool/package-lock.json"
          cd "$RUNNER_TEMP/wrangler-tool"
          npm --ignore-scripts --no-audit --no-fund ci
      - name: Install
        working-directory: platform
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: platform
        run: npx tsc --noEmit
      - name: Test
        working-directory: platform
        run: npm test
      - name: Screenshots commit from atlas/screens.lock
        id: screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f atlas/screens.lock ] || { echo "::error::atlas/screens.lock missing at $SHA"; exit 1; }
          screens_sha=$(tr -d ' \t\r' < atlas/screens.lock)
          [ "$(wc -l < atlas/screens.lock)" -le 1 ] || { echo "::error::atlas/screens.lock must be one line"; exit 1; }
          case "$screens_sha" in *[!0-9a-f]*|'') echo "::error::atlas/screens.lock is not lowercase hex"; exit 1 ;; esac
          [ "${#screens_sha}" -eq 40 ] || { echo "::error::atlas/screens.lock must hold a full 40-character sha"; exit 1; }
          # the pinned commit must be part of the reviewed atlas-screens history (identical/ahead = branch contains it)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$screens_sha...atlas-screens" -q .status)
          case "$status" in identical|ahead) ;; *) echo "::error::$screens_sha is not on atlas-screens ($status)"; exit 1 ;; esac
          git fetch --depth=1 --no-tags origin "$screens_sha"
          git cat-file -e "$screens_sha^{commit}"
          echo "screens_sha=$screens_sha" >> "$GITHUB_OUTPUT"
          echo "screenshots: atlas-screens @ $screens_sha ($status)"
      - name: Build the Atlas into the Worker's Static Assets
        # The Worker ships the Atlas from platform/.atlas-dist (one deploy = platform + Atlas). Never deploy without it.
        # No CW_PRIVATE_TERMS here: this job runs the released commit's code. check.py skips only its forbidden-text
        # rule; the job `private-scan` applies that rule to the finished assets (and fails when the secret is missing).
        env:
          CW_SCREENS_REQUIRED: '1'
          CW_SCREENS_SHA: ${{ steps.screens.outputs.screens_sha }}
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          node platform/scripts/build-atlas-assets.mjs --src "$GITHUB_WORKSPACE" --build
      - name: Routing check against this Atlas build
        # run_worker_first must keep every non-HTML Atlas file static (test/atlas-assets.test.ts, real file list)
        working-directory: platform
        env:
          CW_REQUIRE_ATLAS_DIST: '1'
        run: npx vitest run test/atlas-assets.test.ts
      - name: IndexNow key file name (for the smoke test)
        id: key
        run: |
          set -euo pipefail
          key=$(ls platform/.atlas-dist | grep -E '^[0-9a-f]{32}\.txt$' | head -n1 | sed 's/\.txt$//' || true)
          echo "indexnow_key=$key" >> "$GITHUB_OUTPUT"
      - name: Release manifest
        env:
          SCREENS_SHA: ${{ steps.screens.outputs.screens_sha }}
          EMERGENCY_REASON: ${{ inputs.emergency_reason }}
        run: |
          set -euo pipefail
          [ -d platform/.atlas-dist ] || { echo "::error::platform/.atlas-dist was not built"; exit 1; }
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          # byte-reproducible tarball of the built assets: sorted names, fixed mtime/owner, gzip without timestamp
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C platform/.atlas-dist -cf - . | gzip -n > "$out/atlas-dist.tar.gz"
          dist_sha256=$(sha256sum "$out/atlas-dist.tar.gz" | cut -d' ' -f1)
          wrangler_version=$("$RUNNER_TEMP/wrangler-tool/node_modules/.bin/wrangler" --version | tail -n1 | tr -d '\r')
          python - "$out/manifest.json" "$dist_sha256" "$wrangler_version" <<'PY'
          import json, os, sys
          path, dist, wrangler = sys.argv[1:4]
          m = {
              'platform_sha': os.environ['SHA'],
              'atlas_data_sha': os.environ['SHA'],
              'screens_sha': os.environ['SCREENS_SHA'],
              'atlas_dist_tar_gz_sha256': dist,
              'atlas_dist_tar_format': 'tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C platform/.atlas-dist -cf - . | gzip -n',
              'wrangler_version': wrangler,
              'run': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'staging_check': os.environ['STAGING_CHECK'],
              'staging_run': os.environ['STAGING_RUN'] or None,
              'emergency_reason': os.environ['EMERGENCY_REASON'].strip() if os.environ['STAGING_CHECK'] == 'overridden' else None,
          }
          json.dump(m, open(path, 'w'), indent=2)
          print(json.dumps(m, indent=2))
          PY
          {
            echo "## Release manifest"
            echo
            echo '```json'
            cat "$out/manifest.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release manifest (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ inputs.sha }}
          path: ${{ runner.temp }}/release/manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Worker bundle without credentials (wrangler --dry-run, no upload)
        # The pinned Wrangler of main bundles the released code: the same Wrangler the credential job runs.
        working-directory: platform
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          "$RUNNER_TEMP/wrangler-tool/node_modules/.bin/wrangler" deploy --env production --dry-run --outdir "$RUNNER_TEMP/bundle"
      - name: Pack the release (bundle, assets, migrations, commit sha, contact address, wrangler.toml)
        id: pack
        run: |
          set -euo pipefail
          s="$RUNNER_TEMP/stage"
          mkdir -p "$s/bundle" "$s/assets" "$s/migrations" "$s/meta"
          cp "$RUNNER_TEMP/bundle/index.js" "$s/bundle/index.js"
          [ ! -f "$RUNNER_TEMP/bundle/index.js.map" ] || cp "$RUNNER_TEMP/bundle/index.js.map" "$s/bundle/"
          cp -r platform/.atlas-dist/. "$s/assets/"
          # a commit without migrations (no folder or no *.sql) packs an empty folder: the gate then has nothing to check
          if [ -d platform/migrations ]; then find platform/migrations -maxdepth 1 -type f -name '*.sql' -exec cp {} "$s/migrations/" \; ; fi
          printf '%s\n' "$SHA" > "$s/meta/sha.txt"
          python3 -c "import json;print(json.load(open('atlas/site/site-config.json'))['contact']['general'])" > "$s/meta/contact.txt"
          cp platform/wrangler.toml "$s/meta/ref-config.toml"
          tar --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/production-build.tar" -C "$s" bundle assets migrations meta
          echo "tar_sha256=$(sha256sum "$RUNNER_TEMP/production-build.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build-${{ inputs.sha }}
          path: ${{ runner.temp }}/production-build.tar
          # kept 3 days: the deploy job downloads it only after the owner's approval. Approve later and the download
          # fails (nothing is deployed): start the run again.
          retention-days: 3
          if-no-files-found: error
          overwrite: true
  private-scan:
    name: Forbidden-text check (trusted)
    needs: [gate, build]
    if: needs.gate.outputs.has_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only trusted code of main runs here (the pinned workflow sha), with the secret CW_PRIVATE_TERMS. The artifact is data.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build-${{ inputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the artifact as data
        env:
          SHA: ${{ inputs.sha }}
          TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TAR_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::malformed job output"; exit 1; }
          [ "$(sha256sum "$RUNNER_TEMP/dl/production-build.tar" | cut -d' ' -f1)" = "$TAR_SHA256" ] || { echo "::error::artifact hash differs from the one the build job reported"; exit 1; }
          python3 trusted/.github/deploy-tools/safe-extract.py "$RUNNER_TEMP/dl/production-build.tar" "$RUNNER_TEMP/x"
          [ "$(tr -d '\n' < "$RUNNER_TEMP/x/meta/sha.txt")" = "$SHA" ] || { echo "::error::artifact is for another commit"; exit 1; }
      - name: Forbidden-text check of the built assets (no release without it)
        env:
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
        run: python3 trusted/.github/deploy-tools/scan-private-terms.py "$RUNNER_TEMP/x/assets" "$RUNNER_TEMP/x/meta/contact.txt" --require
  deploy:
    name: Deploy to production
    needs: [gate, build, private-scan]
    if: needs.gate.outputs.has_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Human approval: the environment `production` has required reviewers and allows only the main branch.
    # This is the only job with the Cloudflare credentials. It runs trusted code of main only (Wrangler pinned by
    # .github/deploy-tools/package-lock.json, installed without lifecycle scripts); the release is data from the build job.
    environment:
      name: production
      url: https://commonworld.one/
    env:
      SHA: ${{ inputs.sha }}
      ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive_migration }}
      STAGING_CHECK: ${{ needs.gate.outputs.staging_check }}
      STAGING_RUN: ${{ needs.gate.outputs.staging_run }}
      W: ${{ github.workspace }}/trusted/.github/deploy-tools/node_modules/wrangler/bin/wrangler.js
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Staging check passed or was overridden in the gate
        env:
          REASON_INPUT: ${{ inputs.emergency_reason }}
        run: |
          set -euo pipefail
          case "$STAGING_CHECK" in
            passed) printf '## Staging check: passed\n\n%s\n' "$STAGING_RUN" >> "$GITHUB_STEP_SUMMARY" ;;
            overridden)
              reason=$(printf '%s' "$REASON_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              case "$reason" in ''|*[[:cntrl:]]*) echo "::error::override without a one-line emergency_reason"; exit 1 ;; esac
              printf '## EMERGENCY OVERRIDE: staging check skipped\n\n**Reason given:**\n\n> %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::the gate's staging check did not pass (got '$STAGING_CHECK')"; exit 1 ;;
          esac
      - name: Sha is still a full commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::bad sha '$SHA'"; exit 1 ;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::bad sha '$SHA'"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" -q .status)
          case "$status" in identical|ahead) ;; *) echo "::error::$SHA is not on main ($status)"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build-${{ inputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the release as data and check its Wrangler config
        env:
          TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
        run: bash trusted/.github/deploy-tools/prepare-production.sh "$GITHUB_WORKSPACE/trusted" "$RUNNER_TEMP/dl/production-build.tar" "$TAR_SHA256" "$SHA" "$RUNNER_TEMP/deploy"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned Wrangler (lockfile of main, no lifecycle scripts)
        working-directory: trusted/.github/deploy-tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production version before this deploy (for rollback)
        # Printed BEFORE migrations and deploy, so a rollback has the version id at hand (docs/DEPLOY.md, Rollback).
        # `deployments status --json` prints the current deployment ({"versions": [{"version_id", "percentage"}], ...});
        # `rollback [version-id] --env production -m ... -y`.
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/deployment-before.json"; err="$RUNNER_TEMP/deployment-before.err"
          if node "$W" deployments status --config wrangler.toml --env production --json > "$json" 2> "$err"; then
            versions=$(python - "$json" <<'PY'
          import json, re, sys
          raw = open(sys.argv[1], encoding='utf-8').read()
          d = json.loads(raw[raw.index('{'):])
          vs = d.get('versions') or []
          if not vs or not all(re.fullmatch(r'[0-9a-f-]{36}', v.get('version_id', '')) for v in vs):
              sys.exit('deployments status: no readable version ids')
          for v in vs:
              print(f"{v['version_id']} {v.get('percentage')}%")
          PY
            )
            prev=$(echo "$versions" | sort -k2 -t' ' -rn | head -n1 | cut -d' ' -f1)
            echo "production before this deploy:"; echo "$versions"
            {
              echo "## Production version before this deploy"
              echo
              echo '```'
              echo "$versions"
              echo '```'
              echo "Roll the Worker back to it (in platform/, production token):"
              echo
              echo '```sh'
              echo "npx wrangler rollback $prev --env production -m \"rollback from $SHA\" -y"
              echo '```'
              echo
              echo "First production deploy: this may be the empty placeholder that \`wrangler secret put\` created; it is not a recovery point (docs/DEPLOY.md, First production deploy, step 5)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif grep -qE 'has no deployments|\[code: 10007\]' "$err"; then
            # first production deploy: the Worker has no deployment yet (10007 = Worker not found)
            cat "$err"
            echo "::notice::no earlier production version: first deploy, rollback = launch runbook"
            printf '## Production version before this deploy\n\nNone (first production deploy). Rollback follows the launch runbook.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$err"
            echo "::error::could not read the current production version (needed for rollback)"; exit 1
          fi
      - name: Migration gate (expand -> deploy -> contract)
        # Migrations run while the OLD Worker is still live: pending ones must not drop, rename or wipe what it uses.
        # The gate script is the one of main (trusted); the migration files are the release's, read as data.
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # migrations_dir of the commonworld-prod binding in [env.production] (wrangler default: migrations)
          dir=$(python - <<'PY'
          import tomllib
          cfg = tomllib.load(open('wrangler.toml', 'rb'))
          dbs = (cfg.get('env', {}).get('production', {}) or {}).get('d1_databases') or cfg.get('d1_databases') or []
          print(next((d.get('migrations_dir') for d in dbs if d.get('database_name') == 'commonworld-prod' and d.get('migrations_dir')), 'migrations'))
          PY
          )
          if [ ! -d "$dir" ] || [ -z "$(find "$dir" -maxdepth 1 -type f -name '*.sql' -print -quit)" ]; then echo "::notice::no migration files in $dir: nothing to check"; exit 0; fi
          node "$W" d1 migrations list commonworld-prod --remote --config wrangler.toml --env production 2>&1 | tee "$RUNNER_TEMP/migrations-pending.txt"
          python "$GITHUB_WORKSPACE/trusted/scripts/check-migrations.py" --dir "$dir" --pending-from "$RUNNER_TEMP/migrations-pending.txt" \
            --sha "$SHA" --allow "$ALLOW_DESTRUCTIVE"
      - name: Time Travel bookmark before migrations (for a database restore)
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node "$W" d1 time-travel info commonworld-prod --config wrangler.toml --env production 2>&1 | tee "$RUNNER_TEMP/bookmark.txt"
          {
            echo "## D1 Time Travel before migrations"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bookmark.txt"
            echo '```'
            cat <<'MD'
          Restore (owner decision only, overwrites the live database), in platform/ with the production token:
          `npx wrangler d1 time-travel restore commonworld-prod --env production --bookmark=<bookmark above>`
          MD
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply database migrations
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$W" d1 migrations apply commonworld-prod --remote --config wrangler.toml --env production
      - name: Deploy the Worker
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$W" deploy bundle/index.js --no-bundle --config wrangler.toml --env production --message "commonworld $SHA"
  verify:
    name: Smoke test (production)
    needs: [gate, build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No environment, no secrets: smoke checks from the released commit's scripts, read-only requests to the live site.
    # A red run means check the failing route now and, if the release broke it, roll back with the command in
    # "Production version before this deploy" of the deploy job summary.
    env:
      SHA: ${{ inputs.sha }}
      INDEXNOW_KEY: ${{ needs.build.outputs.indexnow_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Smoke test
        run: |
          set -u
          host=https://commonworld.one
          body=$(mktemp)
          check() {  # path, expected text in the body ('' = any); up to 6 tries, 10 s apart
            local code=000
            for _ in 1 2 3 4 5 6; do
              # status code alone on stdout, body in a file (no newline splitting); 000 = no HTTP answer
              code=$(curl -sS --max-time 15 -o "$body" -w '%{http_code}' "$host$1") || code=000
              if [ "$code" = 200 ] && { [ -z "$2" ] || grep -qF -- "$2" "$body"; }; then echo "ok   $1"; return 0; fi
              sleep 10
            done
            echo "::error::smoke failed on $1 (last status $code)"; return 1
          }
          fail=0
          check / '' || fail=1
          check /health '"environment":"production"' || fail=1
          check /api/v1/index.json '' || fail=1
          check /robots.txt 'Sitemap:' || fail=1
          check /sitemap.xml '<sitemapindex' || fail=1
          check /sitemap-v1.xml '<urlset' || fail=1
          check /atlas/sitemap.xml '<urlset' || fail=1
          # IndexNow key file: the key named in the Atlas build (the 32-hex .txt in the assets, found by the build job) must be served as is
          key="$INDEXNOW_KEY"
          if [[ "$key" =~ ^[0-9a-f]{32}$ ]]; then check "/$key.txt" "$key" || fail=1; else echo "::error::no IndexNow key file in the build"; fail=1; fi
          # www -> apex, permanent, path and query kept
          www_ok=0
          for _ in 1 2 3 4 5 6; do  # the www certificate can take a moment after the Custom Domain is created
            loc=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.commonworld.one/atlas/?smoke=1") || loc=000
            if [ "$loc" = "301 https://commonworld.one/atlas/?smoke=1" ]; then www_ok=1; break; fi
            sleep 10
          done
          if [ "$www_ok" = 1 ]; then echo "ok   www -> apex"; else echo "::error::www redirect: got '$loc'"; fail=1; fi
          exit $fail
      - name: Route smoke list (production)
        # platform/smoke/routes.json of the released commit, read-only GETs (docs/DEPLOY.md, "Route smoke list after
        # every deploy").
        run: |
          set -euo pipefail
          if [ ! -f platform/smoke/routes.json ]; then
            echo "::warning::no platform/smoke/routes.json at $SHA (older than the route smoke list): skipped"; exit 0
          fi
          node platform/scripts/smoke.mjs https://commonworld.one --environment production
