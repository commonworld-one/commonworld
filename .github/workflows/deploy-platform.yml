name: Deploy platform (production)
# Production deploy of the Commonworld platform (Cloudflare Worker + D1, folder platform/). See docs/DEPLOY.md.
#
# The gate job still skips the deploy job when a commit has no platform/wrangler.toml (no approval request, no secrets
# handed out, nothing touched); every commit on main since 2026-10-20 has one.
#
# Only started by hand (Actions -> Deploy platform (production) -> Run workflow, branch main) with the full commit
# sha to release. That commit must already be on main. The deploy job uses the GitHub environment `production`:
# it waits for a required reviewer's approval, and only then receives CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# (environment secrets). Never runs on pull_request, push or schedule.
#
# What gets released is fixed by the sha alone: platform code and Atlas data come from that commit, the homepage
# screenshots from the atlas-screens commit named in atlas/screens.lock at that commit. A release manifest (all three
# shas, sha256 of the built Atlas assets, wrangler version) is printed in the job summary and kept as an artifact.
# Pending D1 migrations with destructive, row-writing, review-required or unreadable SQL stop the run (scripts/check-migrations.py,
# expand -> deploy -> contract); allow_destructive_migration = the same sha typed again lets one such release through
# (a migration that changes existing rows also needs a `-- reviewed-by-owner: #<PR>` header line, docs/DEPLOY.md).
# The production version live before the deploy is printed in the summary with the exact rollback command.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit on main to deploy (full 40-character sha)
        required: true
        type: string
      allow_destructive_migration:
        description: Leave empty. Only to let a destructive migration through, type the same sha again
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  # one production deploy at a time; a second one waits, a running one is never cancelled
  group: deploy-platform-production
  cancel-in-progress: false
jobs:
  gate:
    name: Check the commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_platform: ${{ steps.platform.outputs.has_platform }}
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - name: Sha is a full commit id
        run: |
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::sha must be lowercase hex, got '$SHA'"; exit 1 ;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::sha must be the full 40-character commit, got '$SHA'"; exit 1; }
      - name: Sha is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # compare/<sha>...main: "identical" or "ahead" means main contains the commit
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" -q .status)
          case "$status" in identical|ahead) echo "$SHA is on main ($status)" ;;
            *) echo "::error::$SHA is not on main (compare status: $status)"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: platform/ exists in that commit
        id: platform
        run: |
          if [ -f platform/wrangler.toml ]; then echo "has_platform=true" >> "$GITHUB_OUTPUT"
          else echo "has_platform=false" >> "$GITHUB_OUTPUT"; echo "::notice::no platform/wrangler.toml at $SHA, nothing to deploy"; fi
  deploy:
    name: Deploy to production
    needs: gate
    if: needs.gate.outputs.has_platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Human approval: the environment `production` has required reviewers and allows only the main branch.
    environment:
      name: production
      url: https://commonworld.one/
    env:
      SHA: ${{ inputs.sha }}
      ALLOW_DESTRUCTIVE: ${{ inputs.allow_destructive_migration }}
    steps:
      - name: Sha is still a full commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$SHA" in *[!0-9a-f]*|'') echo "::error::bad sha '$SHA'"; exit 1 ;; esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::bad sha '$SHA'"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" -q .status)
          case "$status" in identical|ahead) ;; *) echo "::error::$SHA is not on main ($status)"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Checked-out commit is the requested one
        if: hashFiles('platform/wrangler.toml') != ''
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$SHA" ] || { echo "::error::checked out $head, expected $SHA"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('platform/wrangler.toml') != ''
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: hashFiles('platform/wrangler.toml') != ''
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        run: npx tsc --noEmit
      - name: Test
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        run: npm test
      - name: Screenshots commit from atlas/screens.lock
        id: screens
        if: hashFiles('platform/wrangler.toml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f atlas/screens.lock ] || { echo "::error::atlas/screens.lock missing at $SHA"; exit 1; }
          screens_sha=$(tr -d ' \t\r' < atlas/screens.lock)
          [ "$(wc -l < atlas/screens.lock)" -le 1 ] || { echo "::error::atlas/screens.lock must be one line"; exit 1; }
          case "$screens_sha" in *[!0-9a-f]*|'') echo "::error::atlas/screens.lock is not lowercase hex"; exit 1 ;; esac
          [ "${#screens_sha}" -eq 40 ] || { echo "::error::atlas/screens.lock must hold a full 40-character sha"; exit 1; }
          # the pinned commit must be part of the reviewed atlas-screens history (identical/ahead = branch contains it)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$screens_sha...atlas-screens" -q .status)
          case "$status" in identical|ahead) ;; *) echo "::error::$screens_sha is not on atlas-screens ($status)"; exit 1 ;; esac
          git fetch --depth=1 --no-tags origin "$screens_sha"
          git cat-file -e "$screens_sha^{commit}"
          echo "screens_sha=$screens_sha" >> "$GITHUB_OUTPUT"
          echo "screenshots: atlas-screens @ $screens_sha ($status)"
      - name: Build the Atlas into the Worker's Static Assets
        # The Worker ships the Atlas from platform/.atlas-dist (one deploy = platform + Atlas). Never deploy without it.
        if: hashFiles('platform/wrangler.toml') != ''
        env:
          CW_SCREENS_REQUIRED: '1'
          CW_SCREENS_SHA: ${{ steps.screens.outputs.screens_sha }}
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
        run: |
          set -euo pipefail
          [ -n "$CW_PRIVATE_TERMS" ] || { echo "::error::secret CW_PRIVATE_TERMS not set: no release without the forbidden-text check"; exit 1; }
          python -m pip install -r requirements.txt
          node platform/scripts/build-atlas-assets.mjs --src "$GITHUB_WORKSPACE" --build
      - name: Routing check against this Atlas build
        # run_worker_first must keep every non-HTML Atlas file static (test/atlas-assets.test.ts, real file list)
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        env:
          CW_REQUIRE_ATLAS_DIST: '1'
        run: npx vitest run test/atlas-assets.test.ts
      - name: Release manifest
        if: hashFiles('platform/wrangler.toml') != ''
        env:
          SCREENS_SHA: ${{ steps.screens.outputs.screens_sha }}
        run: |
          set -euo pipefail
          [ -d platform/.atlas-dist ] || { echo "::error::platform/.atlas-dist was not built"; exit 1; }
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          # byte-reproducible tarball of the built assets: sorted names, fixed mtime/owner, gzip without timestamp
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C platform/.atlas-dist -cf - . | gzip -n > "$out/atlas-dist.tar.gz"
          dist_sha256=$(sha256sum "$out/atlas-dist.tar.gz" | cut -d' ' -f1)
          wrangler_version=$(cd platform && npx --no-install wrangler --version | tail -n1 | tr -d '\r')
          python - "$out/manifest.json" "$dist_sha256" "$wrangler_version" <<'PY'
          import json, os, sys
          path, dist, wrangler = sys.argv[1:4]
          m = {
              'platform_sha': os.environ['SHA'],
              'atlas_data_sha': os.environ['SHA'],
              'screens_sha': os.environ['SCREENS_SHA'],
              'atlas_dist_tar_gz_sha256': dist,
              'atlas_dist_tar_format': 'tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C platform/.atlas-dist -cf - . | gzip -n',
              'wrangler_version': wrangler,
              'run': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          json.dump(m, open(path, 'w'), indent=2)
          print(json.dumps(m, indent=2))
          PY
          {
            echo "## Release manifest"
            echo
            echo '```json'
            cat "$out/manifest.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release manifest (artifact)
        if: hashFiles('platform/wrangler.toml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ inputs.sha }}
          path: ${{ runner.temp }}/release/manifest.json
          retention-days: 90
          if-no-files-found: error
      - name: Production version before this deploy (for rollback)
        # Printed BEFORE migrations and deploy, so a rollback has the version id at hand (docs/DEPLOY.md, Rollback).
        # Syntax checked against wrangler 4.151.1: `deployments status --json` prints the current deployment
        # ({"versions": [{"version_id", "percentage"}], ...}); `rollback [version-id] --env production -m ... -y`.
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/deployment-before.json"; err="$RUNNER_TEMP/deployment-before.err"
          if npx wrangler deployments status --env production --json > "$json" 2> "$err"; then
            versions=$(python - "$json" <<'PY'
          import json, re, sys
          raw = open(sys.argv[1], encoding='utf-8').read()
          d = json.loads(raw[raw.index('{'):])
          vs = d.get('versions') or []
          if not vs or not all(re.fullmatch(r'[0-9a-f-]{36}', v.get('version_id', '')) for v in vs):
              sys.exit('deployments status: no readable version ids')
          for v in vs:
              print(f"{v['version_id']} {v.get('percentage')}%")
          PY
            )
            prev=$(echo "$versions" | sort -k2 -t' ' -rn | head -n1 | cut -d' ' -f1)
            echo "production before this deploy:"; echo "$versions"
            {
              echo "## Production version before this deploy"
              echo
              echo '```'
              echo "$versions"
              echo '```'
              echo "Roll the Worker back to it (in platform/, production token):"
              echo
              echo '```sh'
              echo "npx wrangler rollback $prev --env production -m \"rollback from $SHA\" -y"
              echo '```'
              echo
              echo "First production deploy: this may be the empty placeholder that \`wrangler secret put\` created; it is not a recovery point (docs/DEPLOY.md, First production deploy, step 5)."
            } >> "$GITHUB_STEP_SUMMARY"
          elif grep -qE 'has no deployments|\[code: 10007\]' "$err"; then
            # first production deploy: the Worker has no deployment yet (10007 = Worker not found)
            cat "$err"
            echo "::notice::no earlier production version: first deploy, rollback = launch runbook"
            printf '## Production version before this deploy\n\nNone (first production deploy). Rollback follows the launch runbook.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$err"
            echo "::error::could not read the current production version (needed for rollback)"; exit 1
          fi
      - name: Migration gate (expand -> deploy -> contract)
        # Migrations run while the OLD Worker is still live: pending ones must not drop, rename or wipe what it uses.
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # migrations_dir of the commonworld-prod binding in [env.production] (wrangler default: migrations)
          dir=$(python - <<'PY'
          import tomllib
          cfg = tomllib.load(open('wrangler.toml', 'rb'))
          dbs = (cfg.get('env', {}).get('production', {}) or {}).get('d1_databases') or cfg.get('d1_databases') or []
          print(next((d.get('migrations_dir') for d in dbs if d.get('database_name') == 'commonworld-prod' and d.get('migrations_dir')), 'migrations'))
          PY
          )
          if [ ! -d "$dir" ]; then echo "::notice::no migrations directory platform/$dir: nothing to check"; exit 0; fi
          npx wrangler d1 migrations list commonworld-prod --remote --env production 2>&1 | tee "$RUNNER_TEMP/migrations-pending.txt"
          cd "$GITHUB_WORKSPACE"
          python scripts/check-migrations.py --dir "platform/$dir" --pending-from "$RUNNER_TEMP/migrations-pending.txt" \
            --sha "$SHA" --allow "$ALLOW_DESTRUCTIVE"
      - name: Time Travel bookmark before migrations (for a database restore)
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info commonworld-prod --env production 2>&1 | tee "$RUNNER_TEMP/bookmark.txt"
          {
            echo "## D1 Time Travel before migrations"
            echo
            echo '```'
            cat "$RUNNER_TEMP/bookmark.txt"
            echo '```'
            cat <<'MD'
          Restore (owner decision only, overwrites the live database), in platform/ with the production token:
          `npx wrangler d1 time-travel restore commonworld-prod --env production --bookmark=<bookmark above>`
          MD
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply database migrations
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply commonworld-prod --remote --env production
      - name: Deploy the Worker
        if: hashFiles('platform/wrangler.toml') != ''
        working-directory: platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production --message "commonworld $SHA"
      - name: Smoke test
        if: hashFiles('platform/wrangler.toml') != ''
        run: |
          set -u
          host=https://commonworld.one
          body=$(mktemp)
          check() {  # path, expected text in the body ('' = any); up to 6 tries, 10 s apart
            local code=000
            for _ in 1 2 3 4 5 6; do
              # status code alone on stdout, body in a file (no newline splitting); 000 = no HTTP answer
              code=$(curl -sS --max-time 15 -o "$body" -w '%{http_code}' "$host$1") || code=000
              if [ "$code" = 200 ] && { [ -z "$2" ] || grep -qF -- "$2" "$body"; }; then echo "ok   $1"; return 0; fi
              sleep 10
            done
            echo "::error::smoke failed on $1 (last status $code)"; return 1
          }
          fail=0
          check / '' || fail=1
          check /health '"environment":"production"' || fail=1
          check /api/v1/index.json '' || fail=1
          check /robots.txt 'Sitemap:' || fail=1
          check /sitemap.xml '<sitemapindex' || fail=1
          check /sitemap-v1.xml '<urlset' || fail=1
          check /atlas/sitemap.xml '<urlset' || fail=1
          # IndexNow key file: the key named in the Atlas build (platform/.atlas-dist/<32 hex>.txt) must be served as is
          key=$(ls platform/.atlas-dist | grep -E '^[0-9a-f]{32}\.txt$' | head -n1 | sed 's/\.txt$//')
          if [ -n "$key" ]; then check "/$key.txt" "$key" || fail=1; else echo "::error::no IndexNow key file in the build"; fail=1; fi
          # www -> apex, permanent, path and query kept
          www_ok=0
          for _ in 1 2 3 4 5 6; do  # the www certificate can take a moment after the Custom Domain is created
            loc=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.commonworld.one/atlas/?smoke=1") || loc=000
            if [ "$loc" = "301 https://commonworld.one/atlas/?smoke=1" ]; then www_ok=1; break; fi
            sleep 10
          done
          if [ "$www_ok" = 1 ]; then echo "ok   www -> apex"; else echo "::error::www redirect: got '$loc'"; fail=1; fi
          exit $fail
