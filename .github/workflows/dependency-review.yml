name: Dependency review
# Fails this check on a pull request when the change adds or updates a dependency that has a known high or critical
# advisory (GitHub advisory database, compared between the base and the PR head). The check is red; it does not stop
# a merge unless a ruleset later requires it (main has no required checks today). Needs the dependency graph (on).
# Runs on every PR to main with no path filter, so it can be made a required check later.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
