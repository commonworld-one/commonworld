name: Deploy platform (staging)
# Staging deploy of the Commonworld platform (Worker commonworld-api-staging + D1 commonworld-staging, folder platform/).
# See docs/DEPLOY.md, "Staging deploy from GitHub".
#
# Why it exists: Workers Static Assets are uploaded with a short-lived upload JWT in the Authorization header
# (POST /accounts/<id>/workers/assets/upload). An egress proxy that injects the Cloudflare API token on every request
# to api.cloudflare.com overwrites that JWT, so the upload fails with 401 and a sandboxed agent cannot deploy staging.
# A GitHub runner sends the JWT untouched.
#
# Only started by hand (Actions -> Deploy platform (staging) -> Run workflow, "Use workflow from" = main) with the
# branch or commit to try on staging. The workflow file itself always comes from main; the deployed code comes from
# the input ref. Every wrangler call is pinned to --env staging; the job stops if wrangler.toml at that ref does not
# map env.staging to commonworld-api-staging / commonworld-staging. Never runs on pull_request, push or schedule.
#
# After the deploy and its smoke test, the job `e2e` runs the Playwright suite (platform/e2e, projects api, phone, tablet,
# desktop) against https://staging.commonworld.one with the specs of the same commit. It gets no secrets and no
# test-citizen keys, and CW_E2E_ALLOW_REGISTER=0, so every spec that would write (posts, comments, votes, moderation,
# throwaway citizens) skips itself: the run only reads, plus POST /v1/csp-report probes (log-only, nothing stored but
# rate-limit counters). A red e2e job makes the whole run red; the HTML report is kept as an artifact on failure.
#
# After the smoke test the deploy job runs the route smoke list (platform/smoke/routes.json, platform/scripts/smoke.mjs)
# against staging; a failing entry fails the job.
#
# After a passing smoke test and route smoke list the deploy job uploads the artifact staging-deployed-<deployed sha> (90 days). The production
# workflow looks it up to require a green staging deploy + e2e of the exact commit it releases (#145, docs/DEPLOY.md).
#
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the GitHub environment `staging`. The token must NOT be the
# production token. Intended scope: Workers Scripts Edit on the staging Worker and D1 Edit. The Cloudflare token form
# offered no per-database scope for D1 Edit when last checked, so unless the token is limited some other way, what it can
# reach beyond staging is decided by its scope in Cloudflare, which this workflow does not check. CW_PRIVATE_TERMS is a repository secret (read only by the job `private-scan`).
#
# Jobs (a runner never holds a secret and runs code of the dispatched ref at the same time):
#   build         the ref's code (npm ci, tsc, tests, Atlas build, wrangler --dry-run bundle). No environment, no secrets.
#                 Uploads one tar: Worker bundle, built assets, migration files, commit sha, the ref's wrangler.toml.
#   private-scan  forbidden-text check of the built assets with CW_PRIVATE_TERMS. Trusted scripts of main only.
#   migrate       (apply_migrations) report and apply D1 migrations on commonworld-staging. Trusted wrangler of main.
#   deploy        wrangler deploy of the prebuilt bundle. Trusted wrangler of main, Wrangler config generated from an
#                 allowlist (.github/deploy-tools/make-staging-config.py), never the ref's wrangler.toml itself.
#   Deploy to staging  (named so for the production gate) smoke test, route smoke list and the staging-deployed artifact,
#                 secret-free, on the exact commit that was deployed.
# Trusted = .github/deploy-tools of this workflow's own commit (github.sha, pinned for the whole run). The ref's
# migration files are read as data (SQL applied to commonworld-staging only); the ref's Worker code is what gets
# deployed, which is the point of a staging run. Settings in the ref's wrangler.toml outside the allowlist fail the run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or full commit sha in this repository to deploy to staging
        required: true
        type: string
      apply_migrations:
        description: Apply pending D1 migrations on commonworld-staging before the deploy
        required: false
        default: true
        type: boolean
permissions:
  contents: read
# No job here uses the Actions cache, and both check out the dispatched ref and run its npm scripts.
cache-mode: none
concurrency:
  group: deploy-platform-staging
  cancel-in-progress: false
jobs:
  resolve:
    # Runs no code of the ref: it only checks the ref out, parses wrangler.toml as data and fixes the commit sha that
    # every later job uses. The sha therefore comes from this job, never from the job that runs the ref's code.
    name: Resolve ref
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    env:
      REF: ${{ inputs.ref }}
    steps:
      - name: Ref is a plain branch name or sha
        run: |
          case "$REF" in ''|-*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::bad ref '$REF'"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: wrangler.toml maps env.staging to the staging Worker and database only
        id: target
        run: |
          set -euo pipefail
          [ -f platform/wrangler.toml ] || { echo "::error::no platform/wrangler.toml at $REF"; exit 1; }
          python3 - <<'PY'
          import sys, tomllib
          cfg = tomllib.load(open('platform/wrangler.toml', 'rb'))
          st = (cfg.get('env') or {}).get('staging') or {}
          name = st.get('name')
          dbs = [d.get('database_name') for d in (st.get('d1_databases') or [])]
          routes = [r.get('pattern') for r in (st.get('routes') or [])]
          print('env.staging name:', name, 'd1:', dbs, 'routes:', routes)
          ok = name == 'commonworld-api-staging' and dbs == ['commonworld-staging'] and routes and all(p == 'staging.commonworld.one' for p in routes)
          sys.exit(0 if ok else 'env.staging must be commonworld-api-staging / commonworld-staging / staging.commonworld.one only')
          PY
          echo "deploying $(git rev-parse HEAD) ($REF) to staging"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "## Staging deploy of \`$(git rev-parse HEAD)\` ($REF)" >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Build candidate (no secrets)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tar_sha256: ${{ steps.pack.outputs.tar_sha256 }}
    env:
      REF: ${{ inputs.ref }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          # no pip cache: the jobs that follow hold credentials and a restored cache would be input from an earlier, less trusted run
      - name: Install
        working-directory: platform
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: platform
        run: npx tsc --noEmit
      - name: Test
        working-directory: platform
        run: npm test
      - name: Build the Atlas into the Worker's Static Assets
        # no CW_PRIVATE_TERMS here: this job runs the ref's code. check.py skips only its forbidden-text rule; the job
        # `private-scan` applies that rule to the finished assets.
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          node platform/scripts/build-atlas-assets.mjs --src "$GITHUB_WORKSPACE" --build
      - name: Routing check against this Atlas build
        working-directory: platform
        env:
          CW_REQUIRE_ATLAS_DIST: '1'
        run: npx vitest run test/atlas-assets.test.ts
      - name: Worker bundle without credentials (wrangler --dry-run, no upload)
        working-directory: platform
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --env staging --dry-run --outdir "$RUNNER_TEMP/bundle"
      - name: Pack the candidate (bundle, assets, migrations, commit sha, contact address, wrangler.toml)
        id: pack
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::HEAD is not the resolved commit"; exit 1; }
          s="$RUNNER_TEMP/stage"
          mkdir -p "$s/bundle" "$s/assets" "$s/migrations" "$s/meta"
          cp "$RUNNER_TEMP/bundle/index.js" "$s/bundle/index.js"
          [ ! -f "$RUNNER_TEMP/bundle/index.js.map" ] || cp "$RUNNER_TEMP/bundle/index.js.map" "$s/bundle/"
          cp -r platform/.atlas-dist/. "$s/assets/"
          cp platform/migrations/*.sql "$s/migrations/"
          printf '%s\n' "$SHA" > "$s/meta/sha.txt"
          python3 -c "import json;print(json.load(open('atlas/site/site-config.json'))['contact']['general'])" > "$s/meta/contact.txt"
          cp platform/wrangler.toml "$s/meta/ref-config.toml"
          tar --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/staging-build.tar" -C "$s" bundle assets migrations meta
          echo "tar_sha256=$(sha256sum "$RUNNER_TEMP/staging-build.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-build-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/staging-build.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true
  private-scan:
    name: Forbidden-text check (trusted)
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-build-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the artifact as data
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TAR_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::malformed job output"; exit 1; }
          [ "$(sha256sum "$RUNNER_TEMP/dl/staging-build.tar" | cut -d' ' -f1)" = "$TAR_SHA256" ] || { echo "::error::artifact hash differs from the one the build job reported"; exit 1; }
          python3 trusted/.github/deploy-tools/safe-extract.py "$RUNNER_TEMP/dl/staging-build.tar" "$RUNNER_TEMP/x"
          [ "$(tr -d '\n' < "$RUNNER_TEMP/x/meta/sha.txt")" = "$SHA" ] || { echo "::error::artifact is for another commit"; exit 1; }
      - name: Forbidden-text check of the built assets
        env:
          CW_PRIVATE_TERMS: ${{ secrets.CW_PRIVATE_TERMS }}
        run: python3 trusted/.github/deploy-tools/scan-private-terms.py "$RUNNER_TEMP/x/assets" "$RUNNER_TEMP/x/meta/contact.txt"
  migrate:
    name: Apply migrations (trusted)
    needs: [resolve, build, private-scan]
    if: inputs.apply_migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.commonworld.one/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-build-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the artifact as data and generate the Wrangler config
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
        run: bash trusted/.github/deploy-tools/prepare.sh "$GITHUB_WORKSPACE/trusted" "$RUNNER_TEMP/dl/staging-build.tar" "$TAR_SHA256" "$SHA" "$RUNNER_TEMP/deploy"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned Wrangler (lockfile of main, no lifecycle scripts)
        working-directory: trusted/.github/deploy-tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migration report (staging has no gate, report only)
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/trusted/.github/deploy-tools/node_modules/wrangler/bin/wrangler.js" d1 migrations list commonworld-staging --remote --config wrangler.json 2>&1 | tee "$RUNNER_TEMP/migrations-pending.txt"
          python3 "$GITHUB_WORKSPACE/trusted/scripts/check-migrations.py" --dir "$RUNNER_TEMP/deploy/migrations" --pending-from "$RUNNER_TEMP/migrations-pending.txt" \
            --sha "$SHA" --warn-only
      - name: Apply database migrations (staging)
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node "$GITHUB_WORKSPACE/trusted/.github/deploy-tools/node_modules/wrangler/bin/wrangler.js" d1 migrations apply commonworld-staging --remote --config wrangler.json
  deploy:
    name: Staging deploy (trusted)
    needs: [resolve, build, private-scan, migrate]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' && needs.private-scan.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.commonworld.one/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-build-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/dl
      - name: Unpack the artifact as data and generate the Wrangler config
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TAR_SHA256: ${{ needs.build.outputs.tar_sha256 }}
        run: bash trusted/.github/deploy-tools/prepare.sh "$GITHUB_WORKSPACE/trusted" "$RUNNER_TEMP/dl/staging-build.tar" "$TAR_SHA256" "$SHA" "$RUNNER_TEMP/deploy"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned Wrangler (lockfile of main, no lifecycle scripts)
        working-directory: trusted/.github/deploy-tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy the Worker (staging)
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          SHA: ${{ needs.resolve.outputs.sha }}
          REF: ${{ inputs.ref }}
        run: node "$GITHUB_WORKSPACE/trusted/.github/deploy-tools/node_modules/wrangler/bin/wrangler.js" deploy bundle/index.js --no-bundle --config wrangler.json --message "staging ${SHA:0:7} ($REF)"
  verify:
    # The name is the one the production gate looks for (deploy-platform.yml: job "Deploy to staging" succeeded, plus the
    # artifact below). It only runs after the trusted deploy succeeded, so "success" still means: deployed, smoke ok,
    # route smoke ok, sha recorded.
    name: Deploy to staging
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ needs.resolve.outputs.sha }}
    env:
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Smoke test (staging)
        run: |
          set -u
          host=https://staging.commonworld.one
          body=$(mktemp)
          check() {  # path, expected text in the body ('' = any); up to 6 tries, 10 s apart
            local code=000
            for _ in 1 2 3 4 5 6; do
              code=$(curl -sS --max-time 15 -o "$body" -w '%{http_code}' "$host$1") || code=000
              if [ "$code" = 200 ] && { [ -z "$2" ] || grep -qF -- "$2" "$body"; }; then echo "ok   $1"; return 0; fi
              sleep 10
            done
            echo "::error::smoke failed on $1 (last status $code)"; return 1
          }
          fail=0
          check / '' || fail=1
          check /health '"environment":"staging"' || fail=1
          check /api/v1/index.json '' || fail=1
          check /atlas/ '' || fail=1
          exit $fail
      - name: Route smoke list (staging)
        # platform/smoke/routes.json of the deployed commit, read-only GETs (docs/DEPLOY.md, "Route smoke list after
        # every deploy"). Runs before the deployed sha is recorded: a failing entry leaves no staging-deployed-<sha>
        # artifact, so production refuses this commit until the route is fixed (or the entry, if the entry is wrong).
        run: |
          set -euo pipefail
          if [ ! -f platform/smoke/routes.json ]; then
            echo "::warning::no platform/smoke/routes.json at $REF (older than the route smoke list): skipped"; exit 0
          fi
          node platform/scripts/smoke.mjs https://staging.commonworld.one --environment staging
      - name: Record the deployed sha (read by the production workflow)
        env:
          DEPLOYED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$DEPLOYED_SHA" ] || { echo "::error::HEAD moved"; exit 1; }
          mkdir -p "$RUNNER_TEMP/staging-deployed"
          printf '%s\n' "$DEPLOYED_SHA" > "$RUNNER_TEMP/staging-deployed/sha.txt"
      - name: Deployed sha (artifact staging-deployed-<sha>)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # one name per deployed commit; a re-run of the same commit replaces it, a re-run that deployed another
          # commit adds a second name, which the production check treats as no proof
          name: staging-deployed-${{ needs.resolve.outputs.sha }}
          path: ${{ runner.temp }}/staging-deployed/sha.txt
          retention-days: 90
          if-no-files-found: error
          overwrite: true
  e2e:
    name: E2E against staging (read-only)
    # Same commit the deploy job shipped (not the ref again: a branch can move in between). No environment, no secrets.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://staging.commonworld.one
      CW_E2E_EXPECT_NOINDEX: '1'
      CW_E2E_ALLOW_REGISTER: '0'
      SHA: ${{ needs.verify.outputs.sha }}
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (api, phone, tablet, desktop) against staging
        run: |
          set -euo pipefail
          # read-only guard: no test-citizen key may reach this job (they would turn the write specs on)
          for v in CW_E2E_HUMAN_KEY CW_E2E_AGENT_KEY CW_E2E_MODERATOR_KEY CW_E2E_ADMIN_KEY; do
            [ -z "${!v:-}" ] || { echo "::error::$v is set: the staging e2e job must run without test-citizen keys"; exit 1; }
          done
          echo "## Staging e2e of \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          npm run test:e2e
      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-e2e-report-${{ needs.verify.outputs.sha }}
          path: |
            platform/e2e/playwright-report/
            platform/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
