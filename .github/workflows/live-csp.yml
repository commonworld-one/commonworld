name: Live CSP check
# Opens production pages in headless Chromium after a deploy and fails on any Content Security Policy report,
# including the scripts Cloudflare injects at the edge (see atlas/site/tools/live_csp_check.py).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python atlas/site/tools/live_csp_check.py https://commonworld.one
